schemaVersion: "1"

# Sandbox name = SSH host (<name>.sbx): letters, digits and hyphens only.
name: zed-dev-env

# The workload kit is the base "agent": its name is the kit directory name.
agent: zed-ssh

# Relative paths resolve against the directory of this file.
kits:
  - ./kits/zed-ssh
  - ./kits/nushell
  - ./kits/docker-agent
  - ./kits/go-toolchain


# Mounted at the same path as on the host, so VS Code (or Zed) opens that same path remotely.
workspace: ./demo

# https://docs.docker.com/ai/sandboxes/configuration/environment-files/
# sbx setup ssh
# sbx env create -f sbxenv.zed.yaml --force
# zed --new ssh://zed-dev-env.sbx$PWD/demo
# stop:
# sbx env rm -f sbxenv.zed.yaml --force