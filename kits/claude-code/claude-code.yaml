# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Claude Code
description: Claude Code (claude), Anthropic's coding agent CLI
sourceUrl: https://code.claude.com

dockerfile: ./claude-code.dockerfile

args:
  claude_version:
    # An exact release (no "stable"/"latest": `provides` needs a real version)
    default: "2.1.292"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: CLAUDE_VERSION

provides: ["claude-code@${{ kit.args.claude_version }}"]

capabilities:
  # Egress is deny-by-default: the API, login and update endpoints.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com
          - platform.claude.com
          - claude.com
          - code.claude.com
          - downloads.claude.ai
          - mcp-proxy.anthropic.com
