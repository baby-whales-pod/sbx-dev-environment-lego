# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Nushell
description: Nushell (nu), a structured-data shell

args:
  nushell_version:
    # A release tag of https://github.com/nushell/nushell/releases (no leading "v")
    default: "0.116.1"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: NUSHELL_VERSION

provides: ["nushell@${{ kit.args.nushell_version }}"]

capabilities:
  # nu needs no outbound network of its own (no module/crate-style registry).
  # - type: com.docker.sandbox/agent-context@1
  #   config:
  #     contentFile: ./nushell-context.md
