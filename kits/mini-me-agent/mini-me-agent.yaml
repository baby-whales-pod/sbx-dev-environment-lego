# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Mini Me Agent
description: Mini Me (mm), a minimalist coding agent for local LLMs
sourceUrl: https://rickub.com/bots-garden/mini-me

provides: ["mini-me@0.7.0"]

dockerfile: ./mini-me-agent.dockerfile

args:
  mm_version:
    # A release tag of https://rickub.com/bots-garden/mini-me/releases
    default: "v0.7.0"
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
    buildArg: MM_VERSION

capabilities:
  # Egress is deny-by-default. mm talks to a model server running on the host.
  # Check the port/host for your setup, then `sbx policy log` if it is blocked.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - host.docker.internal:12434 # Docker Model Runner
          - host.docker.internal:11434 # Ollama
          - host.docker.internal:17434 # Llmman
